{% extends 'base.html' %}
{% block content %}

    <h2>Produtos</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Quantidade</th>
        <th>Preço</th>
    </tr>
    {% for p in produtos %}
    <tr>
        <td>{{ p[0] }}</td>
        <td>{{ p[1] }}</td>
        <td>{{ p[2] }}</td>
        <td>{{R% p[3] }}</td>

    </tr>
    {% endfor %}

</table>
{% endblock %}
